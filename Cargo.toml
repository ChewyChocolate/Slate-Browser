[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/blocking",
    "crates/ui-bridge",
    "crates/engine-adapter",
    "crates/app",
    "spikes/spike-webkit",
    "spikes/spike-cef",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Slate Contributors"]

[workspace.dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
slate-core = { path = "crates/core" }
slate-blocking = { path = "crates/blocking" }
slate-ui-bridge = { path = "crates/ui-bridge" }
slate-engine-adapter = { path = "crates/engine-adapter" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"
